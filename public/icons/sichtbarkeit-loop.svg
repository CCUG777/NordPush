<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="44" height="44" fill="none" role="img" aria-label="Mehr Sichtbarkeit">
  <!-- NordPush · "mehr Sichtbarkeit" — LOOP (gut sichtbar): Kurve zeichnet sich alle 4s neu auf -->
  <defs>
    <linearGradient id="npl-s" x1="3" y1="20" x2="21" y2="4" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7C5CFC"/>
      <stop offset=".5" stop-color="#9B7BF7"/>
      <stop offset="1" stop-color="#B9A6FF"/>
    </linearGradient>
    <filter id="npl-s-glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="1.3"/>
    </filter>
  </defs>
  <style>
    .npl-axis{stroke:url(#npl-s);stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round;opacity:.3}
    .npl-cycle{animation:npl-fade 4s ease-in-out infinite}
    .npl-curve{stroke:url(#npl-s);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;
      stroke-dasharray:100;stroke-dashoffset:100;animation:npl-draw 4s cubic-bezier(.4,0,.2,1) infinite}
    .npl-pt{fill:url(#npl-s)}
    .npl-tip{fill:url(#npl-s)}
    .npl-halo{fill:url(#npl-s);filter:url(#npl-s-glow);transform-box:fill-box;transform-origin:center;
      animation:npl-halo 2.2s ease-in-out infinite}
    @keyframes npl-fade{0%{opacity:0}8%{opacity:1}55%{opacity:1}78%{opacity:0}100%{opacity:0}}
    @keyframes npl-draw{0%,6%{stroke-dashoffset:100}34%,100%{stroke-dashoffset:0}}
    @keyframes npl-halo{0%,100%{opacity:.2;transform:scale(.8)}50%{opacity:.55;transform:scale(1.35)}}
    @media (prefers-reduced-motion:reduce){
      .npl-cycle{opacity:1;animation:none}
      .npl-curve{stroke-dashoffset:0;animation:none}
      .npl-halo{opacity:.32;animation:none}
    }
  </style>
  <path class="npl-axis" d="M4 5V19.2H20"/>
  <g class="npl-cycle">
    <path class="npl-curve" pathLength="100" d="M5 15.6L9 12.8L13 14.1L19 6.7"/>
    <circle class="npl-pt" cx="9" cy="12.8" r="1.15"/>
    <circle class="npl-pt" cx="13" cy="14.1" r="1.15"/>
    <circle class="npl-halo" cx="19" cy="6.7" r="1.7"/>
    <circle class="npl-tip" cx="19" cy="6.7" r="1.45"/>
  </g>
</svg>
