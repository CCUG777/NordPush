<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="44" height="44" fill="none" role="img" aria-label="Eine neue Website">
  <!-- NordPush · "eine neue Website" — LOOP (gut sichtbar): Fensterinhalt baut sich alle 4s neu auf -->
  <defs>
    <linearGradient id="npl-w" x1="2" y1="2" x2="22" y2="22" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#B9A6FF"/>
      <stop offset=".55" stop-color="#9B7BF7"/>
      <stop offset="1" stop-color="#7C5CFC"/>
    </linearGradient>
  </defs>
  <style>
    .npl-frame{stroke:url(#npl-w);stroke-width:1.6;stroke-linejoin:round;stroke-linecap:round}
    .npl-dot{fill:url(#npl-w);animation:npl-dot 2.2s ease-in-out infinite}
    .npl-d2{animation-delay:.3s}.npl-d3{animation-delay:.6s}
    .npl-cycle{animation:npl-fade 4s ease-in-out infinite}
    .npl-ln{stroke:url(#npl-w);stroke-width:1.6;stroke-linecap:round;stroke-dasharray:100;stroke-dashoffset:100}
    .npl-l1{animation:npl-d1 4s ease-in-out infinite}
    .npl-l2{animation:npl-d2k 4s ease-in-out infinite}
    .npl-l3{animation:npl-d3k 4s ease-in-out infinite}
    @keyframes npl-dot{0%,100%{opacity:.35}50%{opacity:1}}
    @keyframes npl-fade{0%{opacity:0}8%{opacity:1}55%{opacity:1}78%{opacity:0}100%{opacity:0}}
    @keyframes npl-d1{0%,5%{stroke-dashoffset:100}26%,100%{stroke-dashoffset:0}}
    @keyframes npl-d2k{0%,10%{stroke-dashoffset:100}31%,100%{stroke-dashoffset:0}}
    @keyframes npl-d3k{0%,15%{stroke-dashoffset:100}36%,100%{stroke-dashoffset:0}}
    @media (prefers-reduced-motion:reduce){
      .npl-cycle{opacity:1;animation:none}
      .npl-ln{stroke-dashoffset:0;animation:none}
      .npl-dot{animation:none;opacity:1}
    }
  </style>
  <rect class="npl-frame" x="3" y="4" width="18" height="15" rx="2.4"/>
  <line class="npl-frame" x1="3" y1="8" x2="21" y2="8"/>
  <circle class="npl-dot" cx="5.6" cy="6" r=".7"/>
  <circle class="npl-dot npl-d2" cx="7.9" cy="6" r=".7"/>
  <circle class="npl-dot npl-d3" cx="10.2" cy="6" r=".7"/>
  <g class="npl-cycle">
    <path class="npl-ln npl-l1" pathLength="100" d="M6 11.6H13.5"/>
    <path class="npl-ln npl-l2" pathLength="100" d="M6 14.2H18"/>
    <path class="npl-ln npl-l3" pathLength="100" d="M6 16.8H15"/>
  </g>
</svg>
